name: Verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # ONNX uses CGO; compile and test on each native platform.
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.59.0'
      - name: Verify
        run: just ci
      - name: Build
        run: just build
      - name: Package and smoke-test release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: just release-package
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: binary-${{ matrix.runner }}
          path: bin/releases/*.tar.gz
          if-no-files-found: error

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: bin/releases
          merge-multiple: true
      - name: Publish verified archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd bin/releases
          test "$(ls -1 *.tar.gz | wc -l)" -eq 4
          sha256sum *.tar.gz > checksums.txt
          gh release create "$RELEASE_TAG" *.tar.gz checksums.txt \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file ../../.github/release-notes.md
